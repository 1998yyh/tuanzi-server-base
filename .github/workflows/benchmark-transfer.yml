name: benchmark-transfer

# 临时基准测试：实测「CI 构建镜像 push 到 ghcr → 国内服务器 docker pull」跨境拉取耗时
# 只手动触发；服务器只 pull 不重启容器，不影响现网。拉取步骤加 15min 超时，避免再挂两小时。
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/1998yyh/tuanzi-server-base
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t $IMAGE:benchmark .

      - name: Report image size
        run: docker images $IMAGE

      - name: Push to ghcr (timed)
        run: |
          echo "=== push 开始 ==="
          time docker push $IMAGE:benchmark

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Server pull from ghcr (timed, 15min cap)
        run: |
          ssh -o BatchMode=yes ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             echo '=== server pull 开始 ===' && \
             timeout 900 bash -c 'time docker pull ${{ env.IMAGE }}:benchmark' ; \
             echo \"pull exit=\$?\" ; \
             docker rmi ${{ env.IMAGE }}:benchmark 2>/dev/null ; \
             docker logout ghcr.io"
