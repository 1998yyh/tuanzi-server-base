name: benchmark-transfer

# 临时基准测试：实测「CI 构建镜像 → docker save | ssh docker load 直传」耗时
# 手动触发；只 load 不重启容器，不影响现网。测完由正式 deploy workflow 取代。
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t tuanzi-server-base-app:benchmark .

      - name: Report image size
        run: docker images tuanzi-server-base-app

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Save and compress (timed)
        run: |
          time docker save tuanzi-server-base-app:benchmark | gzip > /tmp/app.tar.gz
          ls -lh /tmp/app.tar.gz

      - name: Transfer and load on server (timed)
        run: |
          time ssh -o BatchMode=yes ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} \
            "gunzip | docker load && docker image prune -f" < /tmp/app.tar.gz

      - name: Cleanup benchmark image on server
        run: |
          ssh -o BatchMode=yes ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} \
            "docker rmi tuanzi-server-base-app:benchmark"
